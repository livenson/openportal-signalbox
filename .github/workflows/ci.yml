name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly, for the live job: the pin names a release, but the client comes
    # from PyPI, the agent binaries from a GitHub release, and the base image
    # moves under both — none of which a push would notice.
    #
    # GitHub disables a schedule after 60 days without a *commit* to the repo —
    # issues, releases and merges do not count — and says so only on the Actions
    # tab. On a quiet repo the nightly stops silently, so check it is still
    # enabled before trusting a green history.
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor because that is what the openportal wheels target
        # (cp310-abi3) and what the containers these tools run in provide.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      # The suite fakes the compiled `openportal` module rather than installing
      # it: the real one is useless without a live agent network to talk to.
      - run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  shell:
    runs-on: ubuntu-latest
    env:
      SCRIPTS: run.sh tui.sh detect.sh stack.sh live.sh stack/bootstrap.sh stack/node.sh
    steps:
      - uses: actions/checkout@v5
      # -x so the version pin the launchers source (openportal.env) is followed
      # rather than reported as an unresolvable source.
      - name: shellcheck
        run: shellcheck -x $SCRIPTS
      - name: launchers parse
        run: for f in $SCRIPTS; do bash -n "$f"; done

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # index.html is one file with an inline module and no build step, so
      # there is nothing to bundle — but a syntax error would only show up in a
      # browser, so the script is extracted and parsed here.
      - name: viewer script parses
        run: |
          python3 - <<'EOF'
          import re
          html = open('index.html').read()
          block = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          assert block, "no module script found in index.html"
          open('/tmp/viewer.mjs', 'w').write(block.group(1))
          EOF
          node --check /tmp/viewer.mjs

  # The only job that needs a real agent network. It builds one and runs the
  # live suite against it, which is the only way to check the claims the
  # offline fake can only assert about itself.
  #
  # Cheap enough to run everywhere the other jobs do: the agents are downloaded
  # as prebuilt release binaries rather than compiled, so a cold run is well
  # under a minute end to end. Nothing is cached between runs and nothing needs
  # to be — which also means this notices a release that has moved or gone.
  #
  # Docker Engine, Compose v2 and Buildx are all preinstalled on the runner.
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every shape in stack/topologies/. `chain` is the one the front ends
        # were designed against; `multi-allocator` shares a provider between
        # two allocators; `zoned` separates two estates so completely that a
        # bridge sees only its own. The suite has to hold across all three
        # without knowing the shape in advance.
        topology: [chain, multi-allocator, zoned]
    steps:
      - uses: actions/checkout@v5
      - name: build and start the agent network
        run: ./stack.sh up ${{ matrix.topology }}
      - name: live suite
        run: ./live.sh
      - name: agent logs
        if: failure()
        run: ./stack.sh logs --no-color --tail 200
      - name: tear down
        if: always()
        run: ./stack.sh down
